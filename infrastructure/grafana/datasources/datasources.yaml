apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    database: "aiops-logs-*"
    url: http://elasticsearch:9200
    jsonData:
      timeField: timestamp
    isDefault: false
    editable: true

version: '3.8'

services:
  # vLLM service for Qwen 3.5 27B (Proposer) - Currently the most powerful open-source model
  # Can be switched to Llama 4 17B by changing the model_id
  vllm-qwen35:
    image: vllm/vllm-openai:latest
    container_name: vllm-qwen35-light
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: [
      "--model", "Qwen/Qwen3.5-27B-Instruct",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--gpu-memory-utilization", "0.95",
      "--dtype", "bfloat16",
      "--max-model-len", "8192",
      "--tensor-parallel-size", "1"
    ]
    networks:
      - aiops_network
    restart: unless-stopped

  # Redis Service - Caching and Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: redis-cache-light
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aiops_network
    restart: unless-stopped

networks:
  aiops_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
    driver: local

# Usage:
# docker-compose -f infrastructure/docker-compose.light.yml up -d
#
# To use Llama 4 17B instead of Qwen 3.5 27B:
# 1. Change the model_id in the command to "meta-llama/Meta-Llama-4-17B-Instruct"
# 2. Change the container_name to "vllm-llama4-light"
# 3. Restart: docker-compose -f infrastructure/docker-compose.light.yml up -d --force-recreate